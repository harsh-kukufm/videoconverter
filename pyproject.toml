# This project was generated with 0.3.25 using template: https://github.com/beeware/briefcase-template @ v0.3.25
[tool.briefcase]
project_name = "Video Converter"
bundle = "com.videoconverter"
version = "0.2.0"
url = "https://github.com/Th3-A6add0n"
license = "MIT"
license-files = ["LICENSE"]
author = "Th3-A6add0n"
author_email = "th3.a6add0n@gmail.com"

[tool.briefcase.app.videoconverter]
formal_name = "Video Converter"
description = "This app lets you downsize big video files. It converts video to H.265 using GPU"

sources = [
    "src/videoconverter",
]
icon = "src/videoconverter/resources/icon"
installer_icon = "src/videoconverter/resources/icon"
requires = [
    "requests>=2.31",
    "PySide6-Essentials~=6.8",
]
test_sources = [
    "tests",
]
test_requires = [
    "pytest",
]

[tool.briefcase.app.videoconverter.macOS]
universal_build = true
# As of Pyside 6.8, PySide enforces a macOS 12 minimum on wheels.
min_os_version = "12.0"
requires = [
    "requests>=2.31",
    "PySide6-Essentials~=6.8",
]

[tool.briefcase.app.videoconverter.linux]
