name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Unit tests. No GUI toolkit required.
  # ---------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: pytest -q tests/

  # ---------------------------------------------------------------------
  # Package on Windows x64 and a single universal macOS build.
  #
  # The macOS build runs on an Apple Silicon runner (macos-14) and
  # produces a Universal 2 .app containing both arm64 and x86_64 slices,
  # because pyproject.toml declares universal_build = true.
  #
  # fail-fast is off so a single platform failure does not cancel the
  # others.
  # ---------------------------------------------------------------------
  package:
    name: Package (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label:   Windows x64
            runner:  windows-latest
            target:  windows
          - label:   macOS Universal
            runner:  macos-14
            target:  macOS

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install briefcase

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Stamping pyproject.toml with version: $VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$TAG' does not contain a valid version (expected vX.Y.Z)"
            exit 1
          fi

          python - <<PY
          import re
          import pathlib

          version = "$VERSION"
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          new_text, count = re.subn(
              r'^version\s*=\s*"[^"]*"',
              f'version = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not find a version field in pyproject.toml")
          path.write_text(new_text, encoding="utf-8")
          print(f"Set version to {version}")
          PY

          grep -E '^version\s*=' pyproject.toml

      - name: Briefcase create
        run: briefcase create ${{ matrix.target }}

      - name: Briefcase build
        run: briefcase build ${{ matrix.target }}

      - name: Briefcase package
        run: briefcase package ${{ matrix.target }} --adhoc-sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoconverter-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Publish to GitHub Releases on version tags.
  #
  # Runs even if some packaging jobs failed, so long as at least one
  # artifact was produced.
  # ---------------------------------------------------------------------
  release:
    name: Release
    needs: [test, package]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.test.result == 'success' &&
      needs.package.result != 'cancelled' &&
      needs.package.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download available artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
        continue-on-error: true

      - name: Report what we have
        id: list
        run: |
          echo "Downloaded artifacts:"
          find artifacts -maxdepth 3 -type f || true
          count=$(find artifacts -type f \
            \( -name '*.msi' -o -name '*.zip' -o -name '*.dmg' \
               -o -name '*.pkg' -o -name '*.AppImage' -o -name '*.flatpak' \) \
            | wc -l)
          echo "installer_count=$count" >> "$GITHUB_OUTPUT"

      - name: Skip publish if nothing was built
        if: steps.list.outputs.installer_count == '0'
        run: |
          echo "::warning::No installers were produced; skipping release."
          echo "This usually means every packaging job failed."

      - name: Publish GitHub Release
        if: steps.list.outputs.installer_count != '0'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.msi
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report partial failure
        if: needs.package.result == 'failure' && steps.list.outputs.installer_count != '0'
        run: |
          echo "::warning::Release published with partial artifacts."
          echo "At least one packaging job failed; see the package matrix above."