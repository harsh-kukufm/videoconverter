name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Unit tests. No GUI toolkit required.
  # ---------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: pytest -q tests/

  # ---------------------------------------------------------------------
  # Package on Windows, macOS Intel, macOS Apple Silicon.
  # ---------------------------------------------------------------------
  package:
    name: Package (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label:   Windows x64
            runner:  windows-latest
            target:  windows
          - label:   macOS Intel
            runner:  macos-13
            target:  macOS
          - label:   macOS Apple Silicon
            runner:  macos-14
            target:  macOS

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install briefcase

      - name: Briefcase create
        run: briefcase create ${{ matrix.target }}

      - name: Briefcase build
        run: briefcase build ${{ matrix.target }}

      - name: Briefcase package
        run: briefcase package ${{ matrix.target }} --adhoc-sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoconverter-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Publish to GitHub Releases on version tags.
  # ---------------------------------------------------------------------
  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded files
        run: find artifacts -maxdepth 3 -type f

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}