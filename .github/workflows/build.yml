name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Fast sanity check: install deps + run unit tests on all platforms.
  # ---------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: pytest -q tests/

  # ---------------------------------------------------------------------
  # Package with Briefcase on each supported platform/arch.
  # ---------------------------------------------------------------------
  package:
    name: Package (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label:   Windows x64
            runner:  windows-latest
            target:  windows
            format:  ""
          - label:   macOS Intel
            runner:  macos-13
            target:  macOS
            format:  ""
          - label:   macOS Apple Silicon
            runner:  macos-14
            target:  macOS
            format:  ""
          - label:   Linux x64
            runner:  ubuntu-latest
            target:  linux
            format:  system

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxext6 libxrender1 libx11-xcb1 libxkbcommon-x11-0 \
            libxcb-image0 libxcb-cursor0 libxcb-shape0 libxcb-randr0 \
            libxcb-xfixes0 libxcb-sync1 libxcb-icccm4 libxcb-keysyms1 \
            libfontconfig1 libsm6 libice6 libglib2.0-0 libgl1 libegl1 \
            libdbus-1-3 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install briefcase

      - name: Briefcase create
        run: briefcase create ${{ matrix.target }} ${{ matrix.format }}

      - name: Briefcase build
        run: briefcase build ${{ matrix.target }} ${{ matrix.format }}

      - name: Briefcase package
        run: briefcase package ${{ matrix.target }} ${{ matrix.format }} --adhoc-sign
        # `--adhoc-sign` avoids requiring code-signing secrets. Remove it
        # and configure signing certificates for notarized release builds.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoconverter-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Attach artifacts to a GitHub Release when a version tag is pushed.
  # ---------------------------------------------------------------------
  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded files
        run: find artifacts -maxdepth 3 -type f

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}